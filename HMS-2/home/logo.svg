<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Main Shield Glow -->
    <radialGradient id="shieldGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Isometric Tower Gradients -->
    <linearGradient id="towerLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="towerCenterTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="towerCenterLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <linearGradient id="towerCenterRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <linearGradient id="towerRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle tech border -->
  <rect width="480" height="480" x="10" y="10" rx="96" fill="url(#bgGrad)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="4" filter="url(#softShadow)"/>
  <circle cx="250" cy="230" r="190" fill="url(#shieldGlow)"/>

  <!-- Futuristic Shield / Hexagonal Aura -->
  <polygon points="250,55 390,135 390,305 250,385 110,305 110,135" fill="none" stroke="rgba(147, 197, 253, 0.18)" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Isometric Base Grid -->
  <g stroke="rgba(99, 102, 241, 0.22)" stroke-width="1.5" fill="none">
    <path d="M 130 330 L 250 400 L 370 330"/>
    <path d="M 160 310 L 250 365 L 340 310"/>
    <path d="M 190 290 L 250 325 L 310 290"/>
    <path d="M 250 400 L 250 430"/>
  </g>

  <!-- Left Tower (Modern Residential Block) -->
  <!-- Top Face -->
  <polygon points="175,190 215,167 215,183 175,206" fill="#38bdf8"/>
  <!-- Left Face -->
  <polygon points="135,213 175,190 175,320 135,343" fill="url(#towerLeft)"/>
  <!-- Right Face -->
  <polygon points="175,190 215,213 215,343 175,320" fill="#0369a1"/>
  <!-- Architectural Window Slits Left Tower -->
  <line x1="147" y1="235" x2="167" y2="223" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="147" y1="255" x2="167" y2="243" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="147" y1="275" x2="167" y2="263" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="147" y1="295" x2="167" y2="283" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Right Tower (Commercial / Amenity Highrise) -->
  <!-- Top Face -->
  <polygon points="285,180 325,157 365,180 325,203" fill="#a78bfa"/>
  <!-- Left Face -->
  <polygon points="285,180 325,203 325,335 285,312" fill="url(#towerRight)"/>
  <!-- Right Face -->
  <polygon points="325,203 365,180 365,312 325,335" fill="#4c1d95"/>
  <!-- Architectural Glow Slits Right Tower -->
  <line x1="337" y1="225" x2="353" y2="216" stroke="#f3e8ff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="337" y1="245" x2="353" y2="236" stroke="#f3e8ff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="337" y1="265" x2="353" y2="256" stroke="#f3e8ff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="337" y1="285" x2="353" y2="276" stroke="#f3e8ff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Center Flagship Tower (Nilayam Heights Centerpiece) -->
  <!-- Roof Top Platform -->
  <polygon points="250,105 300,134 250,163 200,134" fill="url(#towerCenterTop)"/>
  <!-- Center Tower Left Face -->
  <polygon points="200,134 250,163 250,355 200,326" fill="url(#towerCenterLeft)"/>
  <!-- Center Tower Right Face -->
  <polygon points="250,163 300,134 300,326 250,355" fill="url(#towerCenterRight)"/>
  
  <!-- Center Tower Vertical Cyan Core Light Beam -->
  <line x1="250" y1="164" x2="250" y2="355" stroke="url(#neonCyan)" stroke-width="3.5" filter="url(#glowEffect)"/>

  <!-- Center Tower Matrix Windows -->
  <g fill="#93c5fd" opacity="0.9">
    <polygon points="214,166 226,173 226,183 214,176"/>
    <polygon points="234,178 244,184 244,194 234,188"/>
    <polygon points="214,196 226,203 226,213 214,206"/>
    <polygon points="234,208 244,214 244,224 234,218"/>
    <polygon points="214,226 226,233 226,243 214,236"/>
    <polygon points="234,238 244,244 244,254 234,248"/>
    <polygon points="214,256 226,263 226,273 214,266"/>
    <polygon points="234,268 244,274 244,284 234,278"/>
  </g>

  <!-- Glowing Smart Antenna & IoT Beacon -->
  <line x1="250" y1="62" x2="250" y2="105" stroke="#38bdf8" stroke-width="3.5"/>
  <circle cx="250" cy="58" r="8" fill="url(#goldAccent)" filter="url(#glowEffect)"/>
  <circle cx="250" cy="58" r="4" fill="#ffffff"/>

  <!-- Orbital Data Arc (Smart Society Automation) -->
  <path d="M 120 250 A 150 70 25 0 1 380 230" fill="none" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 10" filter="url(#glowEffect)"/>
  <circle cx="370" cy="235" r="5" fill="#38bdf8" filter="url(#glowEffect)"/>

  <!-- Premium Typography: HMS Badge at Bottom -->
  <rect x="145" y="405" width="210" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="url(#neonCyan)" stroke-width="2"/>
  <text x="250" y="433" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">
    NILAYAM <tspan fill="#38bdf8">HMS</tspan>
  </text>
</svg>