services:
  web:
    build: .
    container_name: hms_app
    restart: always
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=hms
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hms_network

  db:
    image: mysql:8.0
    container_name: hms_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hms
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./HMS-2/hms.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hms_network

volumes:
  db_data:

networks:
  hms_network:
    driver: bridge
